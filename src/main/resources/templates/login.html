<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin login | Tuckpointing</title>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@500;600&family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<main>
    <section class="estimate">
        <div class="wrap">
            <div class="section-head">
                <span class="label">Admin only</span>
                <h2>Log in</h2>
            </div>

            <p th:if="${param.error}" class="town-result no">Wrong username or password.</p>
            <p th:if="${param.logout}" class="town-result ok">You've been logged out.</p>

            <!-- th:action adds the hidden CSRF token automatically -->
            <form th:action="@{/login}" method="post" class="est-form">
                <div class="fgrid">
                    <div><label class="label" for="username">Username</label>
                        <input id="username" name="username" class="form-control" type="text" autofocus></div>
                    <div><label class="label" for="password">Password</label>
                        <input id="password" name="password" class="form-control" type="password"></div>
                </div>
                <button class="btn red" type="submit">Log in</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
