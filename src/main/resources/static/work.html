<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!--mobile layout-->
    <meta name="viewport" content="width=device-width">
    <title>Work | Tuckpointing</title>
    <meta name="description" content="Tuckpointing, chimney repair and masonry repair in Oneida, Illinois since 1996.">
    <!--fonts from google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@500;600&family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--stylesheet link-->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<!--The websites header-->
<header class="topbar">
    <nav class="navbar navbar-expand-md navbar-dark wrap" aria-label="Main">
        <!--clickable logo, takes you to index.html-->
        <a class="brand navbar-brand" href="index.html"><img class="logo" src="Photos/TuckpointingLogo.png" alt="Tuckpointing and Masonry Repair"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!--Waffle collapse for phone screens-->
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto gap-md-3">
             <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link" href="work.html">Our work</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>            
            </ul>
            <!--link to contact page and estimate element-->
            <a class="call ms-md-4" href="contact.html#estimate">Free estimate</a>
        </div>
    </nav>
</header>

<main>
    <section class="page-hero">
        <div class="wrap">
            <span class="label">OUR WORK</span>
        <h1>Our work.</h1>
        <p>A look at some chimneys, foundations, stone, and brick jobs.</p>
        </div>
    </section>

    <section id="work">
        <div class="wrap">
            <div class="section-head">
                <span class="label">Our work</span>
                <h2>Project gallery.</h2>
            </div>

            <p class="uc-tag">click a photo to zoom</p>
            <div class="filters" role="group" aria-label="Filter projects">
                <button class="filter on" type="button" data-filter="all">All</button>
                <button class="filter" type="button" data-filter="chimney">Chimneys</button>
                <button class="filter" type="button" data-filter="foundation">Foundations</button>
                <button class="filter" type="button" data-filter="stone">Stone</button>
                <button class="filter" type="button" data-filter="brick">Brick &amp; stucco</button>
            </div>
            <div class="gallery" id="gallery">
                <button class="shot" type="button" data-cat="chimney"><img data-placeholder="chimney" alt="Chimney rebuild"><span>Chimney rebuild</span></button>
                <button class="shot" type="button" data-cat="foundation"><img data-placeholder="foundation" alt="Foundation tuckpointing"><span>Foundation tuckpointing</span></button>
                <button class="shot" type="button" data-cat="stone"><img data-placeholder="stone" alt="Stone veneer"><span>Stone veneer</span></button>
                <button class="shot" type="button" data-cat="brick"><img data-placeholder="brick" alt="Brick repair"><span>Brick repair</span></button>
                <button class="shot" type="button" data-cat="chimney"><img data-placeholder="chimney" alt="Chimney crown"><span>Chimney crown</span></button>
                <button class="shot" type="button" data-cat="foundation"><img data-placeholder="foundation" alt="Block foundation repair"><span>Block foundation repair</span></button>
                <button class="shot" type="button" data-cat="stone"><img data-placeholder="stone" alt="Stone steps"><span>Stone steps</span></button>
                <button class="shot" type="button" data-cat="brick"><img data-placeholder="brick" alt="Stucco"><span>Stucco</span></button>
                <button class="shot" type="button" data-cat="brick"><img data-placeholder="brick" alt="City project, Galva"><span>City project, Galva</span></button>
            </div>
        </div>
    </section>

<div class="modal fade" id="zoomModal" tabindex="-1" aria-labelledby="zoomTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content zoom-content">
            <div class="modal-header">
                <h3 class="modal-title" id="zoomTitle">Project</h3>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body"><img id="zoomImg" alt=""></div>
        </div>
    </div>
</div>
</main>

<!--Website Footer-->
<footer>
    <div class="wrap">
        <!--keeps year up to date through site.js-->
        <span>&copy; <span id="year">2026</span> Tuckpointing LLC &middot; Since 1996</span>
        <span>Licensed &middot; Bonded &middot; Insured</span>   
    </div>
</footer>

<!--jquery and javascript script tags-->
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="JavaScript/site.js"></script>
<script src="JavaScript/work.js"></script>
</body>
</html>
